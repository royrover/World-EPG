
name: Update World EPG

on:
  schedule:
    # ทุกวัน 07:20 น. เวลาไทย (00:20 UTC)
    - cron: "20 0 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of TV listings to download"
        required: false
        default: "2"
      max_connections:
        description: "Maximum concurrent requests"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: world-epg-update
  cancel-in-progress: false

jobs:
  update:
    name: Grab, deduplicate, validate and publish TrueID EPG
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EPG_DAYS: ${{ github.event.inputs.days || '2' }}
      MAX_CONNECTIONS: ${{ github.event.inputs.max_connections || '4' }}
      EPG_OUTPUT_DIR: epg

    steps:
      - name: Checkout World-EPG
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check input values
        shell: bash
        run: |
          set -euo pipefail

          [[ "$EPG_DAYS" =~ ^[1-9][0-9]?$ ]] || {
            echo "::error::EPG_DAYS must be an integer between 1 and 99"
            exit 1
          }

          [[ "$MAX_CONNECTIONS" =~ ^[1-9][0-9]?$ ]] || {
            echo "::error::MAX_CONNECTIONS must be an integer between 1 and 99"
            exit 1
          }

      - name: Clone upstream iptv-org EPG engine
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/iptv-org/epg.git \
            epg-engine

      - name: Install EPG engine dependencies
        working-directory: epg-engine
        run: npm install --no-audit --no-fund

      - name: Select TrueID source only
        id: sources
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SITES < <(
            find epg-engine/sites \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
            grep -i '3bb' |
            sort -u
          )

          if [ "${#SITES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one TrueID source, found ${#SITES[@]}."
            printf '%s\n' "${SITES[@]}"
            exit 1
          fi

          SITE_LIST="${SITES[0]}"

          echo "list=$SITE_LIST" >> "$GITHUB_OUTPUT"
          echo "count=1" >> "$GITHUB_OUTPUT"

          echo "Selected EPG source:"
          echo "$SITE_LIST"

      - name: Download TrueID EPG
        working-directory: epg-engine
        shell: bash
        env:
          SITE_LIST: ${{ steps.sources.outputs.list }}
        run: |
          set -euo pipefail

          mkdir -p "../$EPG_OUTPUT_DIR"

          npm run grab --- \
            --sites="$SITE_LIST" \
            --output="../$EPG_OUTPUT_DIR/guide.xml" \
            --gzip="../$EPG_OUTPUT_DIR/guide.xml.gz" \
            --json="../$EPG_OUTPUT_DIR/guide.json" \
            --days="$EPG_DAYS" \
            --maxConnections="$MAX_CONNECTIONS" \
            --curl


      - name: Deduplicate XMLTV data
        shell: bash
        run: |
          set -euo pipefail

          python scripts/dedupe.py \
            epg/guide.xml \
            epg/guide.xml

      - name: Rebuild GZIP from deduplicated XML
        shell: bash
        run: |
          set -euo pipefail

          gzip -n -c epg/guide.xml > epg/guide.xml.gz

          echo "GZIP rebuilt from deduplicated XML."

      - name: Validate generated EPG files
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_epg.py epg

      - name: Show output sizes
        shell: bash
        run: |
          set -euo pipefail

          echo "EPG source: ${{ steps.sources.outputs.list }}"
          echo "Requested days: $EPG_DAYS"
          echo "Maximum connections: $MAX_CONNECTIONS"

          echo ""
          echo "Generated file sizes:"
          du -h epg/guide.xml epg/guide.xml.gz epg/guide.json

          echo ""
          ls -lh epg/

      - name: Preserve generated files for publishing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/world-epg-publish"

          cp \
            epg/guide.xml \
            epg/guide.xml.gz \
            epg/guide.json \
            "$RUNNER_TEMP/world-epg-publish/"

      - name: Publish data branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan world-epg-publish

          git rm -rf --ignore-unmatch .
          git clean -fdx

          mkdir -p epg

          cp "$RUNNER_TEMP/world-epg-publish/guide.xml" epg/
          cp "$RUNNER_TEMP/world-epg-publish/guide.xml.gz" epg/
          cp "$RUNNER_TEMP/world-epg-publish/guide.json" epg/

          git add \
            epg/guide.xml \
            epg/guide.xml.gz \
            epg/guide.json

          git commit -m "Update TrueID EPG data"

          git push origin HEAD:data --force

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## World EPG Update Summary"
            echo ""
            echo "- Source: TrueID only"
            echo "- Schedule: Every 24 hours (07:20 Thailand time)"
            echo "- Sources selected: ${{ steps.sources.outputs.count || 'not available' }}"
            echo "- Requested days: $EPG_DAYS"
            echo "- Maximum connections: $MAX_CONNECTIONS"
            echo "- Deduplication: XMLTV"
            echo "- Data branch: \`data\`"
            echo ""
            echo "### Public guide URLs"
            echo "- XML: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/epg/guide.xml"
            echo "- GZIP: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/epg/guide.xml.gz"
            echo "- JSON: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/epg/guide.json"
          } >> "$GITHUB_STEP_SUMMARY"
