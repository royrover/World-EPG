name: Update World EPG

on:
  schedule:
    # รันเวลา 17:30 UTC หรือ 00:30 น. (เที่ยงคืนครึ่ง) ตามเวลาประเทศไทย
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of TV listings to download"
        required: false
        default: "2"
      max_connections:
        description: "Maximum concurrent requests to source websites"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: world-epg-update
  cancel-in-progress: false

jobs:
  update:
    name: Grab, validate and publish per-source EPG
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EPG_DAYS: ${{ github.event.inputs.days || '2' }}
      MAX_CONNECTIONS: ${{ github.event.inputs.max_connections || '4' }}
      EPG_OUTPUT_DIR: epg

    steps:
      - name: Checkout World-EPG
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check input values
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EPG_DAYS" =~ ^[1-9][0-9]?$ ]] || {
            echo "::error::EPG_DAYS must be an integer between 1 and 99"
            exit 1
          }
          [[ "$MAX_CONNECTIONS" =~ ^[1-9][0-9]?$ ]] || {
            echo "::error::MAX_CONNECTIONS must be an integer between 1 and 99"
            exit 1
          }

      - name: Clone upstream iptv-org EPG engine
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/iptv-org/epg.git epg-engine

      - name: Install EPG engine dependencies
        working-directory: epg-engine
        run: npm install --no-audit --no-fund

      - name: Discover targeted EPG sources
        id: sources
        shell: bash
        run: |
          set -euo pipefail

          # แก้ regex ตรงนี้เพื่อเลือกแหล่งที่ต้องการ
          TARGET_REGEX="(trueid|3bb)"

          mapfile -t SITES < <(
            find epg-engine/sites \
              -mindepth 1 -maxdepth 1 \
              -type d \
              -printf '%f\n' |
            grep -E "$TARGET_REGEX" |
            sort -u
          )

          if [ "${#SITES[@]}" -eq 0 ]; then
            echo "::error::No matching EPG source configurations found."
            exit 1
          fi

          SITE_LIST=$(IFS=,; echo "${SITES[*]}")
          echo "count=${#SITES[@]}" >> "$GITHUB_OUTPUT"
          echo "list=$SITE_LIST" >> "$GITHUB_OUTPUT"

          echo "Discovered ${#SITES[@]} targeted EPG sources."
          printf '%s\n' "${SITES[@]}"

      # แยกไฟล์ตามแหล่ง: epg/<site>.xml, .xml.gz, .json
      - name: Download EPG per source
        working-directory: epg-engine
        shell: bash
        env:
          SITE_LIST: ${{ steps.sources.outputs.list }}
        run: |
          set -euo pipefail
          mkdir -p "../$EPG_OUTPUT_DIR"

          IFS=',' read -ra SITES <<< "$SITE_LIST"
          ok=0
          for site in "${SITES[@]}"; do
            echo "::group::grab $site"
            if npm run grab -- \
                --sites="$site" \
                --output="../$EPG_OUTPUT_DIR/$site.xml" \
                --gzip="../$EPG_OUTPUT_DIR/$site.xml.gz" \
                --json="../$EPG_OUTPUT_DIR/$site.json" \
                --days="$EPG_DAYS" \
                --maxConnections="$MAX_CONNECTIONS"; then
              ok=$((ok + 1))
            else
              echo "::warning::$site failed, skipped"
              rm -f "../$EPG_OUTPUT_DIR/$site.xml" \
                    "../$EPG_OUTPUT_DIR/$site.xml.gz" \
                    "../$EPG_OUTPUT_DIR/$site.json"
            fi
            echo "::endgroup::"
          done

          if [ "$ok" -eq 0 ]; then
            echo "::error::All sources failed."
            exit 1
          fi

      - name: Validate generated EPG files
        run: |
          set -euo pipefail
          python scripts/validate_epg.py "$EPG_OUTPUT_DIR"

      - name: Show output sizes
        run: |
          set -euo pipefail
          echo "EPG source configurations: ${{ steps.sources.outputs.count }}"
          echo "Requested days: $EPG_DAYS"
          echo "Maximum connections: $MAX_CONNECTIONS"
          ls -lh "$EPG_OUTPUT_DIR"/

      - name: Preserve generated files for publishing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/world-epg-publish"
          cp "$EPG_OUTPUT_DIR"/* "$RUNNER_TEMP/world-epg-publish/"

      - name: Publish data branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan world-epg-publish
          git rm -rf --ignore-unmatch .
          git clean -fdx

          mkdir -p epg
          cp "$RUNNER_TEMP"/world-epg-publish/* epg/

          git add epg/
          git commit -m "Update targeted EPG data"

          git push origin HEAD:data --force

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EPG Update Summary"
            echo ""
            echo "- Schedule: every 24 hours (00:30 ICT / 17:30 UTC)"
            echo "- Sources discovered: ${{ steps.sources.outputs.count || 'not available' }}"
            echo "- Requested days: $EPG_DAYS"
            echo "- Maximum connections: $MAX_CONNECTIONS"
            echo "- Data branch: \`data\`"
            echo ""
            echo "### Public guide URLs"
            for f in "$RUNNER_TEMP"/world-epg-publish/*.xml; do
              [ -e "$f" ] || continue
              n=$(basename "$f" .xml)
              echo "- $n: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/epg/$n.xml (also .xml.gz, .json)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
